- name: Clone Kernel Source
  run: |
    git clone -b ten-uc --depth=1 https://github.com/Rafiester/kernel_xiaomi_msm8953-3.18.git kernel-source
    git clone --depth=1 https://github.com/devnoname120/kernelsu-coccinelle.git

- name: Integrate KernelSU Legacy (v0.9.5)
  run: |
    cd kernel-source
    curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

- name: Apply KernelSU Manual Hooks
  run: |
    cd kernelsu-coccinelle/classic-hooks
    chmod +x apply.sh
    ./apply.sh $GITHUB_WORKSPACE/kernel-source

- name: Build Kernel
  run: |
    cd kernel-source
    export ARCH=arm64
    export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-
    export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/toolchain32/bin/arm-linux-androideabi-
    # Konfigurasi Manual Hook: aktifkan KSU_MANUAL_HOOK dan matikan KPROBES
    scripts/config --file arch/arm64/configs/mido_defconfig \
      -e CONFIG_KSU \
      -e CONFIG_KSU_MANUAL_HOOK \
      -d CONFIG_KPROBES \
      -d CONFIG_KPROBE_EVENTS
    make O=out ARCH=arm64 HOSTCFLAGS+="-fcommon" KCFLAGS="-w" mido_defconfig
    make O=out ARCH=arm64 HOSTCFLAGS+="-fcommon" KCFLAGS="-w" -j$(nproc --all)
