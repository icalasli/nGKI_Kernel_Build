name: Build MSM8953 Kernel 4.9 (KSU Next + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies & Toolchain
      run: |
        sudo apt-get update
        # Instal dependensi build dan toolchain GCC dari repositori Ubuntu
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev llvm clang coccinelle gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Clone Kernel Source, KSU Next, and Patches
      run: |
        # 1. Clone source kernel 4.9
        git clone -b lineage-17.1 --depth=1 https://github.com/icalasli/kernel_xiaomi_msm8953-4.9.git kernel-source
        
        # 2. Clone KernelSU Next (branch legacy)
        git clone -b legacy --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
        
        # 3. Clone Coccinelle patches (scope-minimized-hooks)
        git clone --depth=1 https://github.com/devnoname120/kernelsu-coccinelle.git kernelsu-coccinelle
        
        # 4. Clone SUSFS patches
        git clone -b mainline --depth=1 https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git jack-patches
        git clone -b kernel-4.14 --depth=1 https://github.com/kutemeikito/susfs4ksu.git ksu-patches

    - name: Integrate KernelSU Next & Fix Symlinks
      run: |
        cd kernel-source
        rm -rf KernelSU drivers/kernelsu
        ln -sf "$(pwd)/../KernelSU/kernel" "$(pwd)/drivers/kernelsu"
        
        # Daftarkan konfigurasi KernelSU ke sistem build
        grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i "/endmenu/i\\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
        grep -q "kernelsu/" drivers/Makefile || echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile

    - name: Apply Manual Hooks (Scope-Minimized Coccinelle)
      run: |
        cd kernelsu-coccinelle/scope-minimized-hooks
        chmod +x apply.sh
        # Terapkan hook manual ke source kernel yang masih bersih (sebelum patch SUSFS)
        ./apply.sh $GITHUB_WORKSPACE/kernel-source

    - name: Apply SUSFS Patches (After Manual Hooks)
      run: |
        cd kernel-source
        
        # 1. Patch set_memory (wajib untuk kernel 4.9)
        patch -p1 < ../jack-patches/Patches/Patch/set_memory_to_49_and_low.patch || true
        
        # 2. Patch folder KernelSU untuk SUSFS
        mkdir -p KernelSU
        cp ../ksu-patches/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/ || true
        cd KernelSU
        patch -p1 < 10_enable_susfs_for_ksu.patch || true
        cd ..
        
        # 3. Patch utama kernel untuk SUSFS
        cp ../jack-patches/Patches/Patch/susfs_patch_to_4.9.patch ./
        patch -p1 < susfs_patch_to_4.9.patch || true
        
        # 4. Salin file pendukung SUSFS
        cp -r ../ksu-patches/kernel_patches/fs/* ./fs/ || true
        cp -r ../ksu-patches/kernel_patches/include/linux/* ./include/linux/ || true

    - name: Build Kernel
      run: |
        cd kernel-source
        export ARCH=arm64
        # Menggunakan toolchain GCC dari Ubuntu (versi 9/10/11) yang lebih baru dari 5.1
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Konfigurasi untuk Manual Hook KernelSU Next
        # Referensi: CONFIG_KSU_WITH_KPOBES=n (bukan KPROBES=y)
        scripts/config --file arch/arm64/configs/mido_defconfig \
          -e CONFIG_KSU \
          -e CONFIG_KSU_SUSFS \
          -d CONFIG_KSU_WITH_KPOBES \
          -d CONFIG_KSU_MANUAL_HOOK \
          -d CONFIG_KPROBES \
          -d CONFIG_KPROBE_EVENTS \
          -d CONFIG_LTO_CLANG \
          -d CONFIG_LTO_NONE
        
        make O=out ARCH=arm64 HOSTCFLAGS="-fcommon -w" KCFLAGS="-w" mido_defconfig
        make O=out ARCH=arm64 HOSTCFLAGS="-fcommon -w" KCFLAGS="-w" -j$(nproc --all)

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image-4.9
        path: kernel-source/out/arch/arm64/boot/Image.gz-dtb
