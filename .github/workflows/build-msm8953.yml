name: Build MSM8953 Kernel 4.9 (Ultimate KSU Next)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies & Ubuntu GCC 11
      run: |
        sudo apt-get update
        # Hapus gcc-multilib untuk mencegah konflik, install GCC 11 dari Ubuntu
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev llvm clang gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Clone Kernel Source & KSU Next
      run: |
        # 1. Clone source kernel 4.9
        git clone -b lineage-17.1 --depth=1 https://github.com/icalasli/kernel_xiaomi_msm8953-4.9.git kernel-source
        
        # 2. Clone KernelSU Next (branch legacy)
        git clone -b legacy --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU

    - name: Integrate KernelSU Next & Fix Symlinks
      run: |
        cd kernel-source
        rm -rf KernelSU drivers/kernelsu
        
        # Hubungkan folder KernelSU Next ke driver kernel
        ln -sf "$(pwd)/../KernelSU/kernel" "$(pwd)/drivers/kernelsu"
        
        # Daftarkan konfigurasi
        grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i "/endmenu/i\\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
        grep -q "kernelsu/" drivers/Makefile || echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile

    - name: Apply Official Manual Hooks
      run: |
        cd kernel-source
        # Gunakan patch manual resmi dari repositori KernelSU-Next
        # Ini memastikan Kbuild mendeteksi fungsi hook dengan benar
        curl -L -o hooks.patch https://github.com/KernelSU-Next/KernelSU-Next/raw/next/kernel_patches/syscall_hook/min_scope_syscall_hooks.patch
        patch -p1 < hooks.patch || true

    - name: Build Kernel
      run: |
        cd kernel-source
        export ARCH=arm64
        # Menggunakan GCC 11 dari Ubuntu (Otomatis lolos cek versi >= 5.1)
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Konfigurasi KSU Next
        scripts/config --file arch/arm64/configs/mido_defconfig \
          -e CONFIG_KSU \
          -e CONFIG_KSU_MANUAL_HOOK \
          -d CONFIG_KSU_WITH_KPROBES \
          -d CONFIG_KPROBES \
          -d CONFIG_KPROBE_EVENTS \
          -d CONFIG_LTO_CLANG \
          -d CONFIG_LTO_NONE
        
        # Build (Tambahkan KCFLAGS="-Wno-error" untuk meredam error warning GCC 11)
        make O=out ARCH=arm64 HOSTCFLAGS="-fcommon -w" KCFLAGS="-w -Wno-error" mido_defconfig
        make O=out ARCH=arm64 HOSTCFLAGS="-fcommon -w" KCFLAGS="-w -Wno-error" -j$(nproc --all)

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image-4.9
        path: kernel-source/out/arch/arm64/boot/Image.gz-dtb
