name: Build MSM8953 Kernel 4.9 (KSU Next + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev llvm clang

    - name: Clone Kernel Source & SUSFS Patches
      run: |
        git clone -b lineage-17.1 --depth=1 https://github.com/icalasli/kernel_xiaomi_msm8953-4.9.git kernel-source
        git clone -b kernel-4.14 --depth=1 https://github.com/kutemeikito/susfs4ksu.git susfs-patches

    - name: Integrate KernelSU Next
      run: |
        cd kernel-source
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
        
        if [ -d "KernelSU-Next" ]; then mv KernelSU-Next KernelSU; fi
        if [ ! -d "KernelSU" ]; then mkdir KernelSU; fi

    - name: Apply SUSFS Patches
      run: |
        cd kernel-source
        
        # 1. Patch KernelSU (Tambahkan || true agar jika gagal tetap lanjut)
        cp ../susfs-patches/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/
        cd KernelSU
        patch -p1 < 10_enable_susfs_for_ksu.patch || true
        cd ..
        
        # 2. Patch utama kernel (Tambahkan || true)
        cp ../susfs-patches/kernel_patches/50_add_susfs_in_kernel.patch ./
        patch -p1 < 50_add_susfs_in_kernel.patch || true
        
        # 3. Salin file pendukung
        cp -r ../susfs-patches/kernel_patches/fs/* ./fs/ || true
        cp -r ../susfs-patches/kernel_patches/include/linux/* ./include/linux/ || true

    - name: Setup Toolchain (GCC 4.9)
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git toolchain32

    - name: Build Kernel
      run: |
        cd kernel-source
        export ARCH=arm64
        export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/toolchain32/bin/arm-linux-androideabi-
        
        scripts/config --file arch/arm64/configs/mido_defconfig \
          -e CONFIG_KSU \
          -e CONFIG_KSU_SUSFS \
          -d CONFIG_KPROBES \
          -d CONFIG_KPROBE_EVENTS \
          -d CONFIG_LTO_CLANG \
          -d CONFIG_LTO_NONE
        
        # Build
        make O=out ARCH=arm64 HOSTCFLAGS+="-fcommon" KCFLAGS="-w" LD=$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-ld mido_defconfig
        make O=out ARCH=arm64 HOSTCFLAGS+="-fcommon" KCFLAGS="-w" LD=$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-ld -j$(nproc --all)

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image-4.9
        path: kernel-source/out/arch/arm64/boot/Image.gz-dtb
