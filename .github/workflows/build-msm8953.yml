name: Build MSM8953 Kernel 3.18 (KernelSU Legacy)

on:
  workflow_dispatch:  # INI WAJIB ADA AGAR TOMBOL RUN MUNCUL

jobs:
  build:
    runs-on: ubuntu-22.04  # Pakai 22.04 agar paket lib32 tersedia

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev llvm clang

    - name: Clone Kernel Source
      run: |
        # Menggunakan branch ten-uc yang berisi source code kernel
        git clone -b ten-uc --depth=1 https://github.com/Rafiester/kernel_xiaomi_msm8953-3.18.git kernel-source
        # Clone repositori patch Coccinelle untuk manual hook
        git clone --depth=1 https://github.com/devnoname120/kernelsu-coccinelle.git

    - name: Integrate KernelSU Legacy (v0.9.5)
      run: |
        cd kernel-source
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

    - name: Apply KernelSU Manual Hooks (Coccinelle)
      run: |
        cd kernelsu-coccinelle/classic-hooks
        chmod +x apply.sh
        ./apply.sh $GITHUB_WORKSPACE/kernel-source

    - name: Setup Toolchain (GCC 4.9)
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git toolchain32

    - name: Build Kernel
      run: |
        cd kernel-source
        export ARCH=arm64
        export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/toolchain32/bin/arm-linux-androideabi-
    
        # Konfigurasi Manual Hook: Aktifkan KSU & Manual Hook, Matikan Kprobe
        scripts/config --file arch/arm64/configs/mido_defconfig \
          -e CONFIG_KSU \
          -e CONFIG_KSU_MANUAL_HOOK \
          -d CONFIG_KPROBES \
          -d CONFIG_KPROBE_EVENTS
      
        # Build Kernel (Menambahkan LD untuk memaksa linker dari GCC)
        make O=out ARCH=arm64 HOSTCFLAGS+="-fcommon" KCFLAGS="-w" LD=$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-ld mido_defconfig
        make O=out ARCH=arm64 HOSTCFLAGS+="-fcommon" KCFLAGS="-w" LD=$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-ld -j$(nproc --all)

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image
        path: kernel-source/out/arch/arm64/boot/Image.gz-dtb
