name: Build MSM8953 Kernel 4.9 (KSU Next Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev llvm clang coccinelle

    - name: Clone Kernel Source & KSU Next
      run: |
        # 1. Clone source kernel 4.9
        git clone -b lineage-17.1 --depth=1 https://github.com/icalasli/kernel_xiaomi_msm8953-4.9.git kernel-source
        
        # 2. Clone KernelSU Next (branch legacy)
        git clone -b legacy --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
        
        # 3. Clone repositori Coccinelle untuk manual hooks
        git clone --depth=1 https://github.com/devnoname120/kernelsu-coccinelle.git kernelsu-coccinelle

    - name: Integrate KernelSU Next & Fix Symlinks
      run: |
        cd kernel-source
        rm -rf KernelSU drivers/kernelsu
        
        # Hubungkan folder KernelSU Next ke driver kernel
        ln -sf "$(pwd)/../KernelSU/kernel" "$(pwd)/drivers/kernelsu"
        
        # Daftarkan konfigurasi KernelSU
        grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i "/endmenu/i\\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
        grep -q "kernelsu/" drivers/Makefile || echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile

    - name: Apply Manual Hooks (Coccinelle)
      run: |
        cd kernelsu-coccinelle/scope-minimized-hooks
        chmod +x apply.sh
        # Terapkan patch hook ke kernel
        ./apply.sh $GITHUB_WORKSPACE/kernel-source || true

    - name: Setup Toolchain (LineageOS Prebuilt)
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git toolchain32

    - name: Build Kernel
      run: |
        cd kernel-source
        export ARCH=arm64
        export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/toolchain32/bin/arm-linux-androideabi-
        
        # BYPASS GCC: Hapus baris error secara paksa
        sed -i 's/#error Sorry, your version of GCC is too old - please use 5.1 or newer.//g' include/linux/compiler-gcc.h
        # Tambahan bypass untuk jaga-jaga
        sed -i 's/#if GCC_VERSION < 50100/#if 0 \/\/ Bypass/' include/linux/compiler-gcc.h
        
        # Konfigurasi: Hanya KSU & Manual Hook (Tanpa SUSFS)
        scripts/config --file arch/arm64/configs/mido_defconfig \
          -e CONFIG_KSU \
          -e CONFIG_KSU_MANUAL_HOOK \
          -d CONFIG_KSU_WITH_KPROBES \
          -d CONFIG_KPROBES \
          -d CONFIG_KPROBE_EVENTS \
          -d CONFIG_LTO_CLANG \
          -d CONFIG_LTO_NONE
        
        make O=out ARCH=arm64 HOSTCFLAGS="-fcommon -w" KCFLAGS="-w" LD=$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-ld mido_defconfig
        make O=out ARCH=arm64 HOSTCFLAGS="-fcommon -w" KCFLAGS="-w" LD=$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-ld -j$(nproc --all)

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image-4.9-KSUNext
        path: kernel-source/out/arch/arm64/boot/Image.gz-dtb
